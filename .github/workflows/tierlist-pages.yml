# Publishes tierlist-studio/ to the gh-pages branch, which GitHub Pages serves.
name: Publish Tier List Studio
on:
  push:
    branches: [main, claude/tierlist-studio]
    paths: ['tierlist-studio/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=tierlist-studio -b pages-tmp
          git push -f origin pages-tmp:gh-pages
