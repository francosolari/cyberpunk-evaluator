<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tier List Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Tier List <span>Studio</span></div>
    <nav class="tabs">
      <button data-view="slides" class="active">Slides</button>
      <button data-view="decks">Decks</button>
      <button data-view="cards">Cards</button>
      <button data-view="data">Card Data <span id="data-badge" class="badge"></span></button>
    </nav>
    <div class="actions">
      <button id="btn-present" class="primary">▶ Present</button>
      <button id="btn-png">Export PNG</button>
      <details class="menu">
        <summary>Project</summary>
        <div class="menu-body">
          <button id="btn-export">Save project (.json)</button>
          <label class="filebtn">Load project (.json)<input type="file" id="file-project" accept="application/json,.json" hidden></label>
          <button id="btn-reset" class="danger">Reset to samples</button>
        </div>
      </details>
    </div>
  </header>

  <main id="app">
    <section id="view-slides" class="view active">
      <aside class="panel slide-list">
        <h3>Slides</h3>
        <ol id="slide-list"></ol>
        <div class="row gap">
          <button id="add-tier-slide">+ Tier list</button>
          <button id="add-deck-slide">+ Deck page</button>
        </div>
      </aside>
      <div class="workspace">
        <div class="stage-wrap" id="stage-wrap"><div id="stage-host"></div></div>
        <div class="pool-wrap">
          <div class="pool-head">
            <h3>Unranked decks</h3>
            <span class="hint">Drag onto a tier, or tap a deck and then a tier. Double-click a deck to edit it.</span>
          </div>
          <div id="pool" class="pool" data-drop="pool"></div>
        </div>
      </div>
      <aside class="panel inspector" id="slide-inspector"></aside>
    </section>

    <section id="view-decks" class="view">
      <aside class="panel">
        <h3>Decks</h3>
        <button id="import-deck" class="primary block">⇩ Import deck export</button>
        <button id="add-deck" class="block">+ Blank deck</button>
        <ul id="deck-list" class="list" style="margin-top:12px"></ul>
      </aside>
      <div class="workspace pad" id="deck-editor"></div>
    </section>

    <section id="view-cards" class="view">
      <div class="workspace pad">
        <div class="toolbar">
          <input type="search" id="card-search" placeholder="Search cards…">
          <select id="card-filter">
            <option value="legend">Legends</option>
            <option value="all">All cards</option>
            <option value="card">Non-Legends</option>
          </select>
          <button id="add-card">+ Custom card</button>
        </div>
        <div id="card-grid" class="card-grid"></div>
      </div>
    </section>

    <section id="view-data" class="view">
      <div class="workspace pad narrow" id="data-view"></div>
    </section>
  </main>

  <div id="present" class="present" hidden>
    <div id="present-host"></div>
    <div class="present-hud"><span id="present-count"></span> · ← → to navigate · Esc to exit</div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-x" data-close>×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
